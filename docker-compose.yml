services:
  mysql:
    image: mysql:8.4
    container_name: travel-log-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: travel_log
      MYSQL_USER: travel
      MYSQL_PASSWORD: travel
      MYSQL_ROOT_PASSWORD: change-me-root
    ports:
      - "3306:3306"
    volumes:
      - travel_mysql:/var/lib/mysql

volumes:
  travel_mysql:
